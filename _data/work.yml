# The four areas of work, in order. Home shows `short` under each title, linked
# to /work#id; the Work page shows `body` (Markdown). Edit copy here.
# `id` is the link anchor: one short word, no spaces. `id: ai` turns on the
# canary AI colouring for that area. Every line of a `body` starts with exactly
# four spaces (bullets too: "    - "); three or five breaks the build.

- id: ai
  title: <abbr>AI</abbr> in Detection + Response
  short: >-
    What AI changes about what your defenders can see, what evidence an 
    incident leaves, and how you stop something that acts on its own.
  body: |
    AI is changing who—or what—makes decisions inside an organization, and most response programs were built for human adversaries, human operators, and human scale.

    - **Mapping where agents act:** what they can reach, what they're permitted to do, and what evidence their actions leave.
    - **Responding to agent-driven incidents:** what to watch, how to interrupt an agent mid-action, and how to reconstruct what it did without relying on its own account.
    - **AI inside your detection pipeline:** what it decides on your behalf, and how you'd know when it's wrong.
    - **Exercises with agents in them,** including agents behaving in ways their operators didn't expect.

    The technology is new. The underlying problems of trust, judgment, and accountability are not.

- id: detection
  title: D+R programs
  short: >-
    Building and improving defensive capabilities from technical signal through
    interpretation, escalation, and action.
  body: |
    A detection program competes for a finite resource: the attention and judgment of whoever is expected to act on its output. We start at that end of the pipeline.

    - **Building detection and response** where it's thin or missing: what to watch, how alerts are triaged, who escalates to whom, and what happens next.
    - **Repairing a program that has stopped earning trust:** noise, coverage that exists mostly on paper, runbooks nobody follows.
    - **Assessing an outsourced program:** what your provider actually covers, and what your organization gives them to work with.
    - **Writing and tuning detections alongside your engineers,** so the capability stays when we leave.

    What you keep: working detections and processes, written down and owned by your people.

- id: preparedness
  title: Preparedness + exercises
  short: >-
    Realistic tabletop exercises and adversarial simulations that reveal how
    people and systems make decisions when the plan stops being enough.
  body: |
    Most organizations have a plan for what happens when things go wrong. Fewer know how well it describes what their people will actually do.

    - **Focused tabletop sessions** built around a single hard decision.
    - **Full simulations** with purpose-built infrastructure and realistic evidence, prepared over weeks and run in a day or two. At the far end, they have more in common with alternate reality games than conference-room exercises.
    - **Preparedness foundations:** decision authority, escalation, and response procedures that hold up when information is incomplete.

    What you get: where decisions broke down, why, and what would make them hold next time.

- id: investigations
  title: Independent investigations
  short: >-
    Looking beyond the immediate cause of an incident to understand the
    decisions and conditions that made it possible.
  body: |
    The usual account of an incident begins with what failed and ends with what was fixed. We reconstruct what came before.

    - **Post-incident reconstruction:** what people knew, what they reasonably believed, and which decisions followed.
    - **Independent review of an internal post-mortem,** when leadership wants a second account.
    - **Near-miss reviews,** before a close call becomes the real thing.

    What you get: an account that's fair to the people involved, and the conditions that may still exist elsewhere. We work after the immediate crisis, not as an emergency incident response provider.
