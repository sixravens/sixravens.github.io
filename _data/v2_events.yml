# The events in the 002 figure on /next/v2, in groups. Each one:
#   what  what happens (the first line of the caption)
#   so    what it changed (the second line, after the arrow)
#   by    how far each named force moves, in ring radii: + moves it out,
#         away from the others; - brings it in. Forces: knowledge, authority,
#         incentives, relationships, identity, technology.
#   w     1 if it tends to bring things together, -1 if it pulls them apart,
#         0 if neither. When the forces are badly out of step, only 1s come
#         up; when they're locked tight, only -1s.
# Add, cut or reword freely; the page picks them at random.


