# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: six ravens   # as live; the new layouts set the case via brand-case
email: hello@sixravens.io 
description: >- # this means to ignore newlines until "baseurl:"
  security is culture
baseurl: "" # the subpath of your site, e.g. /blog
url: "sixravens.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
theme: minima
plugins: []
# The minima theme loads jekyll-feed anyway; pointing it at the hand-written
# 1WR feed (which already exists) stops it writing a second one.
feed:
  path: onewhiteraven/feed.xml

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# ---------------------------------------------------------------------------
# The new site, staged. Until launch:
#   /                the original home page (index.markdown), untouched
#   /next/           the new Six Ravens site (next/)
#   /onewhiteraven/  one white raven, at its permanent address
#   /about           redirects to /next/
# At launch: move next/* to the root (and their permalinks), point sr_url at
# the origin, turn noindex off, and retire index.markdown and _layouts/default.html.
# ---------------------------------------------------------------------------
origin: "https://www.sixravens.io"              # absolute links (feeds, link previews)
sr_url: "https://www.sixravens.io/next"         # Six Ravens pages
owr_path: "/onewhiteraven"                      # one white raven, site-relative
owr_url: "https://www.sixravens.io/onewhiteraven"
noindex: true                                   # staged pages stay out of search engines

# Shared nav/footer marks (see _includes/site-nav.html, site-footer.html).
nav_mark: "/assets/images/mark-6r.png"
nav_alt: "Six Ravens"
foot_mark: "/assets/images/mark-6r.png"

# one white raven
owr:
  title: One White Raven
  tagline: A publication of Six Ravens
  description: >-
    Observations that don't fit what people and organizations believe about
    their technology, and about themselves.
  look: whitepaper        # whitepaper or editorial
  subscribe: true         # show the subscribe band
  subscribe_action:       # the provider's form endpoint; until set, the form is disabled

# Pieces live in _posts as YYYY-MM-DD-NNN-slug.md, served at /onewhiteraven/NNN-slug/
# The words on the Six Ravens pages, kept apart from the markup: _copy/*.md.
# Not pages themselves; the templates read them.
collections:
  copy:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: piece, permalink: "/onewhiteraven/:title/" }

markdown: kramdown
exclude:
  - scratch
  - _inbox
  - README.md
  - Gemfile
  - Gemfile.lock
