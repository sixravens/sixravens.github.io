<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unlisted: shared by direct link only. Not linked from the site, kept out of search. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <meta property="og:title" content="{{ page.tagline }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.sixravens.io{{ page.url }}">
  <meta property="og:image" content="https://www.sixravens.io/assets/images/metalogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:       #0d0c0d;
      --surface:     #161516;
      --surface2:    #1f1e1f;
      --border:      #2a292a;
      --white:       #f1f1f1;
      --text-2:      #b5b2b5;
      --muted:       #6b6a6b;
      --amber:       #d88d02;
      --amber-dim:   #8a5a01;
      --canary:      #9b59b6;
      --canary-dim:  #5a2d6e;

      --measure: 40rem;
      --font: 'Montserrat', 'Avenir Next', 'Avenir', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--black);
      color: var(--text-2);
      font-family: var(--font);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* The raven from the home page, sitting quietly behind the text. */
    .bg-raven {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: url('/assets/images/background.png') no-repeat right -12vh top 8vh / min(90vh, 70vw);
      mix-blend-mode: lighten;
      opacity: .35;
    }
    @media (min-width: 720px) { .bg-raven { opacity: .55; } }

    a { color: var(--amber); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    ::selection { background: var(--amber); color: var(--black); }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
    }
    .topbar img { display: block; height: 56px; width: auto; margin-left: -12px; }
    .topbar a.mail { font-size: 13px; color: var(--muted); }
    .topbar a.mail:hover { color: var(--amber); }

    /* Page grid: outline rail + article */
    .page {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 20px 96px;
    }
    .rail { display: none; }

    /* Hero */
    .hero { padding: 48px 0 8px; max-width: var(--measure); }
    /* The mark carries the name; the h1 is for screen readers only. */
    .vh {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .hero .tagline {
      margin: 0 0 28px;
      color: var(--white);
      font-weight: 300;
      font-size: clamp(2.1rem, 7vw, 3.6rem);
      line-height: 1.1;
      letter-spacing: -.01em;
    }
    .hero .tagline em { font-style: italic; color: var(--amber); }
    .hero .lede {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.65;
      color: var(--white);
      font-weight: 300;
    }

    /* Article body */
    article { max-width: var(--measure); }
    article h2 {
      position: relative;
      margin: 48px 0 16px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--white);
      font-size: 1.375rem;
      font-weight: 500;
      line-height: 1.3;
      scroll-margin-top: 24px;
    }
    article h2::before {
      content: "";
      position: absolute;
      top: -1px; left: 0;
      width: 48px; height: 2px;
      background: var(--canary);
    }
    article p { margin: 0 0 1.15em; }
    article strong { color: var(--white); font-weight: 600; }

    article ul { list-style: none; margin: 0 0 1.4em; padding: 0; }
    article li {
      position: relative;
      padding-left: 22px;
      margin: 0 0 .55em;
    }
    article li::before {
      content: "";
      position: absolute;
      left: 0; top: .82em;
      width: 10px; height: 0;
      /* a border, not a 1px background: borders snap to device pixels,
         so every dash renders at the same weight regardless of line offset */
      border-top: 1px solid var(--amber);
    }

    /* Single-sentence turns of argument */
    article p.turn {
      color: var(--white);
      font-size: 1.125rem;
      font-weight: 400;
    }

    /* Close */
    article hr { border: 0; height: 1px; background: var(--border); margin: 56px 0 32px; }
    article p.closing {
      color: var(--white);
      font-weight: 300;
      font-size: clamp(1.35rem, 3.6vw, 1.75rem);
      line-height: 1.4;
      margin-bottom: 36px;
    }
    article p.contact { font-size: 1.125rem; margin: 0; }
    article p.contact a { font-weight: 500; }
    article p.contact a::after {
      content: "";
      display: block;
      width: 100%;
      max-width: 13.5em;
      height: 2px;
      margin-top: 6px;
      background: var(--amber);
    }
    article p.contact a:hover { text-decoration: none; }

    @media (min-width: 720px) {
      body { font-size: 17px; }
      .topbar { padding: 24px 32px; }
      .topbar img { height: 72px; margin-left: -16px; }
      .page { padding: 0 32px 96px; }
      .hero { padding: 72px 0 16px; }
    }

    /* Outline rail, desktop only */
    @media (min-width: 1180px) {
      .page {
        display: grid;
        grid-template-columns: 13rem minmax(0, var(--measure));
        column-gap: 5rem;
      }
      .hero { grid-column: 2; }
      article { grid-column: 2; }
      .rail {
        display: block;
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        position: sticky;
        top: 32px;
        padding-top: 48px;
      }
      .rail ol { list-style: none; margin: 0; padding: 0; }
      .rail a {
        display: block;
        padding: 6px 0 6px 14px;
        border-left: 2px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .rail a:hover { color: var(--text-2); text-decoration: none; }
      .rail a.active { color: var(--white); border-left-color: var(--canary); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-raven" aria-hidden="true"></div>

  <header class="topbar">
    <a href="/" aria-label="Six Ravens home"><img src="/assets/images/logo.png" alt=""></a>
    <a class="mail" href="mailto:hello@sixravens.io?subject=enquiry">hello@sixravens.io</a>
  </header>

  <main class="page">
    <section class="hero">
      <h1 class="vh">Six Ravens</h1>
      <p class="tagline">{{ page.tagline_html }}</p>
      <p class="lede">{{ page.description }}</p>
    </section>

    <nav class="rail" aria-label="On this page"><ol></ol></nav>

    <article>
      {{ content }}
    </article>
  </main>

  <script>
    (function () {
      var heads = document.querySelectorAll('article h2[id]');
      var list = document.querySelector('.rail ol');
      if (!list || !heads.length) return;
      var links = {};
      heads.forEach(function (h) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        list.appendChild(li);
        links[h.id] = a;
      });
      if (!('IntersectionObserver' in window)) return;
      var current;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            if (current) current.classList.remove('active');
            current = links[e.target.id];
            current.classList.add('active');
          }
        });
      }, { rootMargin: '0px 0px -70% 0px' });
      heads.forEach(function (h) { io.observe(h); });
    })();
  </script>
</body>
</html>
