{% capture html %}<!DOCTYPE html>
<html lang="en" data-theme="ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if site.noindex %}
  <meta name="robots" content="noindex, nofollow">
  {%- endif %}
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/system.css?v={{ site.time | date: '%s' }}">
  <style>
    body { font-size: 16px; line-height: 1.7; }
    .page { max-width: 72rem; margin: 0 auto; padding: 0 16px; }
    .page-head { padding: 56px 0 8px; max-width: 40rem; }
    .page-head h1 {
      margin: 0 0 16px;
      color: var(--fg);
      font-weight: 200;
      font-size: clamp(2.1rem, 7vw, 3.6rem);   /* same scale as the about tagline */
      line-height: 1.05;
      letter-spacing: .01em;
      text-transform: lowercase;
    }
    .page-head p { margin: 0; font-size: 1.1rem; color: var(--fg); font-weight: 400; }
    @media (min-width: 720px) {
      body { font-size: 17px; }
      .page { padding: 0 32px; }
      .page-head { padding-top: 88px; }
    }
  </style>
  {% if page.head_style %}<style>{{ page.head_style }}</style>{% endif %}
</head>
<body>
  <div class="bg-raven" aria-hidden="true"></div>
  {% include site-nav.html active=page.nav %}
  <main class="page">
    {{ content }}
  </main>
  {% include site-footer.html %}
</body>
</html>{% endcapture %}{% include brand-case.html html=html %}
